<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__DATE__ · iOS 榜单监测</title>
<style>
:root{--paper:#f5f4ef;--ink:#18333d;--muted:#5d7075;--line:#ccd5d2;--accent:#147482;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px "PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--accent)}header,main{max-width:1500px;margin:auto;padding:30px 36px}header{border-bottom:1px solid var(--line)}.eyebrow{font:11px Menlo,monospace;letter-spacing:3px;color:var(--accent)}.headrow{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font:38px "Songti SC",Georgia,serif;margin:14px 0 10px}.subtitle{color:var(--muted);margin:0;line-height:1.7}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:22px 0}.stat{padding:19px 22px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{font:30px Menlo,monospace;display:block;margin-bottom:5px}.stat span{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px}.toolbar button{border:1px solid var(--line);padding:11px 16px;background:transparent;color:var(--ink);cursor:pointer}.toolbar button.active{background:var(--ink);color:white;border-color:var(--ink)}.filters{display:grid;grid-template-columns:1.3fr repeat(4,1fr) 1.4fr auto;gap:10px;align-items:end;margin-bottom:16px}label{font-size:12px;color:var(--muted);display:block}select,input{display:block;min-width:0;width:100%;border:1px solid var(--line);background:var(--white);border-radius:0;padding:10px;color:var(--ink);margin-top:7px;font:inherit}button{font:inherit}#reset{padding:10px;border:1px solid var(--line);background:transparent;cursor:pointer}#notice{border-left:3px solid var(--accent);padding:10px 14px;color:var(--muted);line-height:1.7;background:#eaf0eb;margin-bottom:20px}.tablewrap{overflow-x:auto;background:var(--white);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:11px;letter-spacing:1px;background:#e9eeea;color:var(--muted);padding:14px 12px}td{padding:15px 12px;border-top:1px solid #e2e6e0;font-size:13px}.app a{font-size:14px;font-weight:600;text-decoration:none;white-space:normal;display:block;max-width:310px}.app small{display:block;color:var(--muted);margin-top:5px;max-width:310px;overflow:hidden;text-overflow:ellipsis}.rank{font:18px Menlo,monospace}.badge{font-size:11px;padding:4px 7px;background:#e5eee8;color:#216b5b;display:inline-block}.pager{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.pager button{border:1px solid var(--line);padding:8px 16px;color:var(--ink);background:transparent}.pager button:disabled{opacity:.35}details{border-top:1px solid var(--line);padding:20px 0;color:var(--muted)}summary{cursor:pointer}#coverage{max-height:350px;overflow:auto;line-height:1.8;padding:15px 0}.empty{padding:50px;text-align:center;color:var(--muted)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}footer{color:var(--muted);font-size:12px;line-height:1.8;margin:20px 0}@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}header,main{padding:22px}.headrow{align-items:start;flex-direction:column}}@media(max-width:600px){.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}h1{font-size:29px}.headrow nav{font-size:12px}.stat b{font-size:25px}}
</style></head>
<body><header><div class="eyebrow">APP SIGNALS / LOCAL RESEARCH</div><div class="headrow"><div><h1>iOS 榜单监测 <span id="date-title">__DATE__</span></h1><p class="subtitle">美国 · 德国 · 日本 / 分类榜单 / 北京时间</p></div><nav><a href="../index.html">日期总览</a><a href="index.md">Markdown 报告</a><label>切换日期<select id="date" aria-label="日期"></select></label></nav></div></header>
<main><div class="stats"><div class="stat"><b id="new-count">—</b><span>已确认新进记录</span></div><div class="stat"><b id="complete-count">—</b><span>完整榜单 / 计划范围</span></div><div class="stat"><b id="comparable-count">—</b><span>可比较范围 / 计划范围</span></div></div>
<div class="toolbar"><button id="entrants" class="active">新进 App</button><button id="full">完整榜单</button></div>
<div class="filters"><label>采集时点<select id="run" aria-label="采集时点"></select></label><label>国家<select id="country" aria-label="国家"><option value="">全部国家</option></select></label><label>大类<select id="family" aria-label="大类"><option value="">全部大类</option><option>应用</option><option>游戏</option></select></label><label>分类<select id="category" aria-label="分类"></select></label><label>榜单<select id="chart" aria-label="榜单"><option value="">全部触发榜单</option><option value="free">免费榜</option><option value="grossing">畅销榜</option></select></label><label>搜索名称 / 开发者 / ID<input id="search" type="search" placeholder="搜索 App" aria-label="搜索 App"></label><button id="reset">重置</button></div>
<div id="notice" role="status"></div><div class="tablewrap"><table><thead><tr><th>APP / 开发者</th><th>国家 / 分类</th><th>免费榜</th><th>畅销榜</th><th>触发 / 视图</th><th>评分 / 数量</th><th>版本日期</th><th>采集时间</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>没有匹配记录。可调整筛选条件；待比较不代表新进为零。</div></div>
<div class="pager"><span id="result-count"></span><div><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></div></div>
<details><summary>数据覆盖、比较依据与异常</summary><div id="coverage"></div></details><footer>免费榜新进前80 或 畅销榜新进前80即入选。只与上一次正式任务比较；缺少完整快照则待比较。<br>榜单在一段时间内逐项采集，各项以实际采集时间为准。数据和报告仅保存在本机。</footer></main>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('payload').textContent),$=id=>document.getElementById(id),cfg=data.config;
let mode='entrants',page=0,filtered=[];const size=80;
const when=t=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t));
const add=(el,value,label)=>el.add(new Option(label,value));
for(const d of data.dates)add($('date'),d,d);$('date').value=data.date;
for(const [key,label] of Object.entries(cfg.countries))add($('country'),key,label);
function categories(){const last=$('category').value;$('category').replaceChildren();add($('category'),'','全部分类');for(const c of cfg.categories.filter(c=>!$('family').value||c.family===$('family').value))add($('category'),c.genreId,c.family+' / '+c.name);if([...$('category').options].some(o=>o.value===last))$('category').value=last;}
function runOptions(wanted){$('run').replaceChildren();if(mode==='entrants')add($('run'),'all','当天全部时点');for(const r of [...data.runs].reverse())add($('run'),r.run.runId,when(r.run.startedAt)+' · '+r.run.status);if([...$('run').options].some(o=>o.value===wanted))$('run').value=wanted;}
function selected(){return data.runs.filter(r=>$('run').value==='all'||r.run.runId===$('run').value);}
function rankText(e,chart){const n=e.ranks?.[chart];return n??(e.rankStates?.[chart]==='outside_top80'?'80以外/未上榜':'缺数');}
function textCell(tr,value,cls){const td=document.createElement('td');td.textContent=value??'—';if(cls)td.className=cls;tr.append(td);return td;}
function draw(){const body=$('rows');body.replaceChildren();const start=page*size;for(const e of filtered.slice(start,start+size)){const tr=document.createElement('tr'),td=document.createElement('td');td.className='app';const a=document.createElement('a');a.textContent=e.name;a.href=e.qimaiUrl;a.target='_blank';a.rel='noopener noreferrer';const small=document.createElement('small');small.textContent=e.developer+' · '+e.appId;td.append(a,small);tr.append(td);textCell(tr,cfg.countries[e.country]+' / '+e.categoryFamily+'·'+e.category);textCell(tr,rankText(e,'free'),'rank');textCell(tr,rankText(e,'grossing'),'rank');const badge=textCell(tr,'');const span=document.createElement('span');span.className='badge';span.textContent=mode==='full'?cfg.charts[e.chart]:(e.triggers||[]).map(x=>cfg.charts[x]).join(' + ');badge.append(span);textCell(tr,(e.rating||'—')+' / '+(e.ratingCount||'—'));textCell(tr,e.latestVersionDate||'—');textCell(tr,when(e.capturedAt));body.append(tr);}const pages=Math.max(1,Math.ceil(filtered.length/size));$('page').textContent=(page+1)+' / '+pages;$('result-count').textContent='匹配 '+filtered.length+' 条记录'+(mode==='entrants'?' · 同一App在不同采集时点分别保留':'');$('prev').disabled=page===0;$('next').disabled=page>=pages-1;$('empty').hidden=filtered.length>0;}
function update(){page=0;const runs=selected();const complete=runs.reduce((n,r)=>n+r.coverage.completeScopes,0),total=runs.reduce((n,r)=>n+r.coverage.plannedScopes,0),comparable=runs.reduce((n,r)=>n+r.coverage.comparableScopes,0);$('new-count').textContent=comparable?runs.reduce((n,r)=>n+(r.counts.confirmedNew||0),0):'待比较';$('complete-count').textContent=complete+' / '+total;$('comparable-count').textContent=comparable+' / '+total;let records=[];for(const r of runs){if(mode==='entrants')records.push(...r.entries);else for(const s of r.snapshots){if(s.chart!==$('chart').value)continue;for(const row of s.rows)records.push({...row,country:s.country,categoryFamily:s.categoryFamily,category:s.category,genreId:s.genreId,chart:s.chart,capturedAt:s.capturedAt,ranks:{[s.chart]:row.position},rankStates:{}});}}
const q=$('search').value.trim().toLowerCase();filtered=records.filter(e=>(!$('country').value||e.country===$('country').value)&&(!$('family').value||e.categoryFamily===$('family').value)&&(!$('category').value||e.genreId===$('category').value)&&(mode==='full'||!$('chart').value||e.triggers.includes($('chart').value))&&(!q||[e.name,e.developer,e.appId].some(t=>(t||'').toLowerCase().includes(q))));filtered.sort((a,b)=>a.country.localeCompare(b.country)||a.genreId.localeCompare(b.genreId)||Math.min(...Object.values(a.ranks).filter(x=>x!==null))-Math.min(...Object.values(b.ranks).filter(x=>x!==null))||a.appId.localeCompare(b.appId));$('notice').textContent=mode==='full'?'完整榜单视图：展示选定时点和榜单的已采集前80。这里的全部App不代表全部新进。':`新进视图：${total-comparable} 个范围待比较。已确认数量仅覆盖可比较范围；首次采集和缺数均不计为零。`;
$('coverage').replaceChildren();for(const r of runs){const h=document.createElement('p');h.textContent=when(r.run.startedAt)+' · 上次任务 '+(r.run.previousRunId||'无')+' · 规则 '+r.run.ruleVersion+' · 程序 '+r.run.codeVersion;$('coverage').append(h);for(const s of r.coverage.scopes.filter(s=>s.status!=='complete'||s.comparison==='unknown')){const line=document.createElement('div');line.textContent=cfg.countries[s.country]+' / '+s.categoryFamily+' / '+s.category+' / '+cfg.charts[s.chart]+'：'+s.status+' · '+(s.reason||'上次缺完整数据或规则不兼容，待比较');$('coverage').append(line);}}
draw();}
function view(next){const wanted=$('run').value;mode=next;runOptions(wanted);if(next==='full'&&!$('chart').value)$('chart').value='free';$('entrants').classList.toggle('active',next==='entrants');$('full').classList.toggle('active',next==='full');update();}
$('date').onchange=()=>location.assign('../'+$('date').value+'/index.html');$('entrants').onclick=()=>view('entrants');$('full').onclick=()=>view('full');for(const id of ['run','country','category'])$(id).onchange=update;$('chart').onchange=()=>{if(mode==='full'&&!$('chart').value)$('chart').value='free';update();};$('family').onchange=()=>{categories();update();};$('search').oninput=update;$('reset').onclick=()=>{for(const id of ['country','family','category','chart','search'])$(id).value='';categories();view('entrants');runOptions();update();};$('prev').onclick=()=>{page--;draw();};$('next').onclick=()=>{page++;draw();};categories();runOptions(new URLSearchParams(location.hash.slice(1)).get('run'));update();
</script></body></html>
